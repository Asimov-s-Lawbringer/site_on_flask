version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: marshall_root
      MYSQL_DATABASE: my_shop_db  
      MYSQL_USER: root
      MYSQL_PASSWORD: qwerty123456
    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
